{% extends "base.html" %}
{% set active_page = 'change-password' %}

{% block title %}Change Password — Ship Inventory{% endblock %}
{% block top_bar_title %}Change Password{% endblock %}

{% block content %}
<div class="card" style="max-width:500px">
    <div class="card-header">🔐 Change Password</div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="4">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="4">
            </div>
            <div class="form-actions">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
