{% extends 'base.html' %}

{% block title %}{{ 'Edit Grease' if item else 'Add Grease' }}{% endblock %}
{% block top_bar_title %}{{ 'Edit Grease' if item else 'Add Grease' }}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <div class="flex-between">
      <h2>{{ 'Edit Grease' if item else 'Add Grease' }}</h2>
    </div>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ '/greases/edit/' ~ item.id if item else '/greases/add' }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-row three">
        <div class="form-group">
          <label for="name">Name <span class="text-muted">*</span></label>
          <input type="text" id="name" name="name" class="form-control" value="{{ item.name if item else '' }}" required>
        </div>
        <div class="form-group">
          <label for="grade">Grade</label>
          <input type="text" id="grade" name="grade" class="form-control" value="{{ item.grade if item else '' }}">
        </div>
        <div class="form-group">
          <label for="uses">Uses</label>
          <input type="text" id="uses" name="uses" class="form-control" value="{{ item.uses if item else '' }}">
        </div>
      </div>

      <div class="form-row three">
        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" name="quantity" class="form-control" value="{{ item.quantity if item else 0 }}" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label for="unit">Unit</label>
          <select id="unit" name="unit" class="form-control">
            {% set selected_unit = item.unit if item else '' %}
            <option value="ltr" {% if selected_unit == 'ltr' %}selected{% endif %}>ltr</option>
            <option value="kg" {% if selected_unit == 'kg' %}selected{% endif %}>kg</option>
            <option value="drum" {% if selected_unit == 'drum' %}selected{% endif %}>drum</option>
            <option value="pcs" {% if selected_unit == 'pcs' %}selected{% endif %}>pcs</option>
          </select>
        </div>
        <div class="form-group">
          <label for="min_stock">Min Stock</label>
          <input type="number" id="min_stock" name="min_stock" class="form-control" value="{{ item.min_stock if item else 0 }}" min="0" step="0.01">
        </div>
      </div>

      <div class="form-row three">
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" class="form-control" value="{{ item.location if item else '' }}">
        </div>
        <div class="form-group"></div>
        <div class="form-group"></div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/greases" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
